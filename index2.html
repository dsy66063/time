<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>极简时钟</title>
    <style>
        body {
            background-color: #000;
            color: #fff;
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
            user-select: none;
        }
        #clock {
            font-size: 15vw;
            font-weight: 200;
            letter-spacing: 5px;
            text-shadow: 0 0 20px rgba(255,255,255,0.3);
        }
        #date {
            font-size: 2vw;
            color: #888;
            margin-top: 10px;
            letter-spacing: 3px;
            text-transform: uppercase;
        }
        #weather {
            margin-top: 40px;
            font-size: 1.5vw;
            color: #00ffcc;
            font-weight: 300;
            padding: 10px 20px;
            border: 1px solid rgba(0, 255, 204, 0.3);
            border-radius: 30px;
            box-shadow: 0 0 15px rgba(0, 255, 204, 0.1);
            display: flex;
            align-items: center;
            gap: 15px;
        }
        .icon { font-size: 2vw; }
    </style>
</head>
<body>

    <div id="clock">00:00:00</div>
    <div id="date">Loading...</div>
    
    <!-- 默认显示上海的天气，你可以改城市名 -->
    <div id="weather">
        <span class="icon">⏳</span>
        <span id="weather-text">正在获取真实天气...</span>
    </div>

    <script>
        // 1. 时钟逻辑
        function updateClock() {
            const now = new Date();
            
            // 格式化时间
            const h = String(now.getHours()).padStart(2, '0');
            const m = String(now.getMinutes()).padStart(2, '0');
            const s = String(now.getSeconds()).padStart(2, '0');
            document.getElementById('clock').innerText = `${h}:${m}:${s}`;

            // 格式化日期
            const days = ['星期日', '星期一', '星期二', '星期三', '星期四', '星期五', '星期六'];
            const y = now.getFullYear();
            const mo = String(now.getMonth() + 1).padStart(2, '0');
            const d = String(now.getDate()).padStart(2, '0');
            document.getElementById('date').innerText = `${y}年${mo}月${d}日 ${days[now.getDay()]}`;
        }
        setInterval(updateClock, 1000);
        updateClock();

        // 2. 免费天气逻辑 (使用 wttr.in 极简接口)
        async function fetchWeather() {
            try {
                // 你可以把 Shanghai 换成 Beijing, Hangzhou 或者拼音城市名
                const response = await fetch('https://wttr.in/Shanghai?format=j1');
                const data = await response.json();
                
                // 解析真实的天气数据
                const temp = data.current_condition[0].temp_C;
                const desc = data.current_condition[0]["lang_zh"][0].value; // 中文描述
                
                // 简单的天气图标映射
                let icon = '☁️';
                if (desc.includes('晴')) icon = '☀️';
                if (desc.includes('雨')) icon = '🌧️';
                if (desc.includes('雪')) icon = '❄️';
                if (desc.includes('雷')) icon = '⛈️';

                // 更新页面
                document.querySelector('.icon').innerText = icon;
                document.getElementById('weather-text').innerText = `${desc}  ${temp}°C`;

            } catch (error) {
                document.getElementById('weather-text').innerText = "天气获取失败 (可能被墙)";
            }
        }
        
        fetchWeather();
        // 每30分钟更新一次天气
        setInterval(fetchWeather, 30 * 60 * 1000);
    </script>
</body>
</html>
